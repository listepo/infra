# License sync targets: every pyrlyn repository licensed under GPL-3.0 receives the canonical
# files of this directory through a `chore/license-sync` pull request (`license-kit sync`) and
# checks them in CI (license-check.yml). Repositories under another license are not listed;
# runa and crates-packages ship a GPL LICENSE but declare MIT (OR Apache-2.0) in Cargo.toml and
# stay out until the maintainer decides. See README.md.
#
# canonical: kind -> file in licenses/. Per target, `files` maps the same kinds to the path in
# that repository (keep each repository's existing filename); `readme` gets the
# license-sync block (readme-snippet.md, {kind} replaced by that file's path relative to the
# README); sync PRs are drafts labelled `license`, `auto-merge: true` opens them ready for
# review with GitHub auto-merge instead (the required checks of main gate the merge).
canonical:
  gpl: LICENSE # GNU GPL v3, verbatim FSF text (https://www.gnu.org/licenses/gpl-3.0.txt)
  commercial: PRICING.md # commercial license terms
readme-snippet: readme-snippet.md
branch: chore/license-sync
label: license
targets:
  - repo: pyrlyn/cox
    files: {gpl: LICENSE, commercial: PRICING.md}
    readme: README.md
    auto-merge: false
  - repo: pyrlyn/rtok
    files: {gpl: LICENSE, commercial: PRICING.md}
    readme: README.md
    auto-merge: false
  - repo: pyrlyn/ketch
    files: {gpl: LICENSE, commercial: PRICING.md}
    readme: README.md
    auto-merge: false
