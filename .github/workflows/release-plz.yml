name: release-plz

# Reusable release-plz flow (modeled on rtok/dunnage release-plz.yml). Call it on push to the
# default branch:
#
# - `detect`: is this push the merge of a release PR? Only a commit line that *is* the PR title
#   counts (`release-commit-pattern`, default `release: vX.Y.Z` with an optional squash suffix
#   " (#123)"); with `release-branch-prefix`, only from a PR whose branch has that prefix.
# - `release-pr`: otherwise, open or refresh the release PR with release-plz (next version +
#   changelog). Held back while the current version has no tag yet (a release in flight).
# - `verify`: on the merge, run `verify-command` on every OS in `verify-os`.
# - `dispatch`: then start the caller's release workflow (`release-workflow`) with
#   `-f tag=<tag-prefix><version>`. That workflow tags and publishes; release-plz does not.
#
# RELEASE_PLZ_TOKEN (fine-grained PAT: contents + pull requests, write) is required: a PR
# opened with GITHUB_TOKEN starts no workflows, so it would be merged with no CI.
#
# Caller job permissions: contents: write, pull-requests: write, actions: write.
on:
  workflow_call:
    inputs:
      cancel-run-on-failure:
        description: >-
          When a job fails, cancel the whole workflow run (every other running or queued
          job, the caller's included). The calling job must grant `actions: write`.
        type: boolean
        required: false
        default: true
      tag-prefix:
        description: Tag prefix before the version, e.g. "v" or "my-crate-v".
        type: string
        required: false
        default: v
      package:
        description: >-
          Cargo package whose version names the release. Empty uses the first workspace
          package from `cargo metadata`.
        type: string
        required: false
        default: ""
      release-workflow:
        description: Caller workflow file dispatched after a release PR merge. Empty skips.
        type: string
        required: false
        default: release.yml
      verify-command:
        description: Bash run on each `verify-os` before the dispatch. Empty skips verify.
        type: string
        required: false
        default: ""
      verify-os:
        description: JSON array of runner labels for verify.
        type: string
        required: false
        default: '["ubuntu-latest", "macos-latest"]'
      mise:
        description: Install tools from the caller's mise.toml (jdx/mise-action) in every job.
        type: boolean
        required: false
        default: true
      release-commit-pattern:
        description: >-
          Extended regex a commit message line must match for the push to count as a release PR
          merge; group 1 is the version. Match release-plz.toml's `pr_name`.
        type: string
        required: false
        default: '^release: v([0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*)( \(#[0-9]+\))?$'
      release-branch-prefix:
        description: >-
          Also require the commit to belong to a pull request whose head branch starts with
          this (e.g. `release-plz-`), so a direct push with the same subject (a bump script)
          is not taken for a merge. Empty skips the check.
        type: string
        required: false
        default: ""
    secrets:
      RELEASE_PLZ_TOKEN:
        description: "Fine-grained PAT (contents + pull requests: write). Not GITHUB_TOKEN: a PR opened with it runs no CI."
        required: true

permissions:
  contents: read
  actions: write # cancel-run on failure

concurrency:
  group: release-plz-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      merged: ${{ steps.check.outputs.merged }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RE: ${{ inputs.release-commit-pattern }}
          BRANCH_PREFIX: ${{ inputs.release-branch-prefix }}
        run: |
          set -euo pipefail
          line="$(git log -1 --format=%B | grep -E "$RE" | head -n1 || true)"
          if [ -n "$line" ] && [ -n "$BRANCH_PREFIX" ]; then
            prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq \
              "[.[] | select(.head.ref | startswith(\"$BRANCH_PREFIX\"))] | length")"
            if [ "$prs" -eq 0 ]; then
              echo "'$line' is not from a $BRANCH_PREFIX* pull request; not a release PR merge"
              line=""
            fi
          fi
          if [ -n "$line" ]; then
            version="$(sed -E "s/$RE/\1/" <<<"$line")"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release PR merge for $version"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag

  release-pr:
    needs: detect
    if: needs.detect.outputs.merged != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # cancel-run on failure
    steps:
      - name: A token that gives the release PR its CI
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RELEASE_PLZ_TOKEN is not set: a PR opened with GITHUB_TOKEN runs no CI." >&2
            echo "See https://release-plz.dev/docs/github/token" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history decide the next version
          persist-credentials: false
      - if: inputs.mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Is a release still being published?
        id: pending
        env:
          PACKAGE: ${{ inputs.package }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg p "$PACKAGE" \
            '[.packages[] | select($p == "" or .name == $p)][0].version')"
          tag="$PREFIX$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=release-plz::$tag is not released yet; release PR left alone"
          fi
      - if: steps.pending.outputs.pending == 'false'
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag

  verify:
    needs: detect
    if: needs.detect.outputs.merged == 'true' && inputs.verify-command != ''
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(inputs.verify-os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: verify
        shell: bash
        env:
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        run: eval "$VERIFY_COMMAND"
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag

  dispatch:
    needs: [detect, verify]
    # verify may be skipped (no verify-command); it must not have failed.
    if: >-
      !cancelled() && needs.detect.outputs.merged == 'true' && inputs.release-workflow != ''
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      # workflow_dispatch with GITHUB_TOKEN is the documented exception: it does start a run.
      - name: Start the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.release-workflow }}
          TAG: ${{ inputs.tag-prefix }}${{ needs.detect.outputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          gh workflow run "$WORKFLOW" -R "$GITHUB_REPOSITORY" --ref "$REF" -f "tag=$TAG"
          echo "::notice title=release::dispatched $WORKFLOW for $TAG on $REF"
      - name: Cancel the run on failure
        if: failure() && inputs.cancel-run-on-failure
        uses: $/.github/actions/cancel-run # nosemgrep: github-actions-mutable-action-tag
