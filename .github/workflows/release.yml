name: release

# Reusable manual release, modeled on rtok's flow (bump.yml / release-plz.yml -> verify.yml ->
# release.yml). The caller owns the `workflow_dispatch` trigger and passes the tag. Stages:
#
#   checks  -> required check runs green on the commit, tag free, publish secrets present
#   verify  -> `verify-command` on every OS in `verify-os` (same gate as CI)
#   build   -> `build-command` per {os, target}; macOS codesign + notarization (optional);
#              `smoke-command` on targets the runner executes natively; archives + sha256
#   release -> GitHub Release (creates the tag at the tested commit), notes, all archives
#   publish -> `cargo publish` (publish-crates) and/or a generic `publish-command`
#
# `dry-run: true` runs checks, verify and build, and stops before anything is created.
# Repositories released with cargo-dist keep dist's generated release.yml (dist refuses a
# hand-edited one) and use release-plz.yml / verify from here; this workflow is for the rest.
#
# Caller job permissions: contents: write (tag + Release), checks: read, actions: read.
# Secrets (all optional; a missing one skips its step with a notice, except where an input
# explicitly asks for it): MACOS_CERTIFICATE (base64 .p12 Developer ID Application),
# MACOS_CERTIFICATE_PWD; notarization with APPSTORE_CONNECT_KEY (+ _KEY_ID, _ISSUER_ID) or
# APPLE_ID + APPLE_TEAM_ID + APPLE_APP_PASSWORD (via .github/actions/macos-sign),
# CARGO_REGISTRY_TOKEN (publish-crates), PUBLISH_TOKEN (exported to publish-command).
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v1.2.3. A `-` suffix (v1.2.3-rc.1) marks a prerelease.
        type: string
        required: true
      dry-run:
        description: Build and verify only; create no tag, Release or publication.
        type: boolean
        required: false
        default: false
      required-checks:
        description: >-
          Newline-separated check-run names that must have concluded `success` on the
          released commit, e.g. "gate". Empty skips the check.
        type: string
        required: false
        default: ""
      mise:
        description: Install tools from the caller's mise.toml (jdx/mise-action) in each job.
        type: boolean
        required: false
        default: true
      verify-command:
        description: Bash run on each `verify-os` (e.g. "just check"). Empty skips verify.
        type: string
        required: false
        default: ""
      verify-os:
        description: JSON array of runner labels for verify.
        type: string
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      build-matrix:
        description: >-
          JSON array of {"os": <runner>, "target": <triple>} entries to build. Entries with
          "smoke": false skip the smoke test.
        type: string
        required: false
        default: >-
          [
          {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
          {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu"},
          {"os": "macos-latest", "target": "aarch64-apple-darwin"},
          {"os": "macos-latest", "target": "x86_64-apple-darwin"},
          {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
          ]
      working-directory:
        description: Directory the build runs in.
        type: string
        required: false
        default: "."
      setup-command:
        description: Bash run before the build (system packages, extra targets). TARGET is set.
        type: string
        required: false
        default: ""
      build-command:
        description: Bash that builds the release binaries. TARGET is set.
        type: string
        required: false
        default: cargo build --release --locked --target "$TARGET"
      bin-dir:
        description: >-
          Where the built binaries land, relative to working-directory. TARGET is expanded.
        type: string
        required: false
        default: target/$TARGET/release
      bins:
        description: Space-separated binary names to package (".exe" is added on Windows).
        type: string
        required: true
      extra-files:
        description: Space-separated files added to every archive (README.md, LICENSE, ...).
        type: string
        required: false
        default: ""
      archive-name:
        description: >-
          Archive base name; REPO, TAG and TARGET are expanded. Default
          "$REPO-$TAG-$TARGET" (REPO = repository name).
        type: string
        required: false
        default: ""
      smoke-command:
        description: >-
          Bash run against the built binaries where the runner executes the target natively
          (e.g. '"$BIN_DIR/mytool" --version'). BIN_DIR, TARGET and TAG are set.
        type: string
        required: false
        default: ""
      macos-sign:
        description: >-
          Codesign (hardened runtime) the macOS binaries and notarize them. Without the
          secrets this is skipped with a notice unless `require-macos-sign` is true.
        type: boolean
        required: false
        default: false
      require-macos-sign:
        description: Fail the release when macOS signing or notarization secrets are missing.
        type: boolean
        required: false
        default: false
      notes-command:
        description: >-
          Bash that writes Release notes to $NOTES_FILE (e.g. git-cliff --latest). Empty uses
          GitHub's generated notes.
        type: string
        required: false
        default: ""
      draft:
        description: Create the Release as a draft.
        type: boolean
        required: false
        default: false
      publish-crates:
        description: Run `publish-crates-command` after the Release (needs CARGO_REGISTRY_TOKEN).
        type: boolean
        required: false
        default: false
      publish-crates-command:
        description: Bash that publishes to crates.io.
        type: string
        required: false
        default: cargo publish --workspace --locked
      publish-command:
        description: >-
          Bash run after the Release (Homebrew tap bump, npm/pub publish, ...). TAG and
          PUBLISH_TOKEN are set; release archives are in ./dist. Empty skips.
        type: string
        required: false
        default: ""
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PWD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
      APPSTORE_CONNECT_KEY:
        required: false
      APPSTORE_CONNECT_KEY_ID:
        required: false
      APPSTORE_CONNECT_ISSUER_ID:
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
      PUBLISH_TOKEN:
        required: false
    outputs:
      tag:
        description: The released tag.
        value: ${{ jobs.checks.outputs.tag }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9._/+-]+$ ]] || { echo "invalid tag '$TAG'" >&2; exit 1; }
          if [ "$DRY_RUN" != "true" ] \
            && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error title=release::tag $TAG already exists"
            exit 1
          fi
          pre=false
          [[ "${TAG##*/}" == *-* ]] && pre=true
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG from $GITHUB_SHA (prerelease: $pre, dry run: $DRY_RUN)"
      - name: Required checks on ${{ github.sha }}
        if: inputs.required-checks != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: ${{ inputs.required-checks }}
        run: |
          set -euo pipefail
          runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '.check_runs[] | [.name, (.conclusion // .status), .completed_at // ""] | @tsv')"
          fail=0
          while IFS= read -r name; do
            name="$(xargs <<<"$name")"
            [ -n "$name" ] || continue
            # Latest run of that name wins (a re-run supersedes an earlier failure).
            result="$(awk -F'\t' -v n="$name" '$1 == n' <<<"$runs" | sort -t$'\t' -k3 \
              | tail -n1 | cut -f2)"
            echo "$name: ${result:-missing}"
            if [ "$result" != "success" ]; then
              echo "::error title=required check::'$name' is '${result:-missing}'"
              fail=1
            fi
          done <<<"$REQUIRED"
          exit "$fail"
      - name: Publish secrets
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PUBLISH_CRATES: ${{ inputs.publish-crates }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          REQUIRE_SIGN: ${{ inputs.require-macos-sign }}
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          # Fail here, before anything is built, rather than after the Release exists.
          fail=0
          if [ "$DRY_RUN" != "true" ] && [ "$PUBLISH_CRATES" = "true" ] \
            && [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::publish-crates is on but CARGO_REGISTRY_TOKEN is not set"; fail=1
          fi
          if [ "$REQUIRE_SIGN" = "true" ] && { [ -z "$CERT" ] || [ -z "$CERT_PWD" ]; }; then
            echo "::error::require-macos-sign is on but MACOS_CERTIFICATE(_PWD) is not set"
            fail=1
          fi
          exit "$fail"

  verify:
    needs: checks
    if: inputs.verify-command != ''
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.verify-os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: ${{ inputs.working-directory }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }} -> target
          save-if: false
      - name: verify
        env:
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        run: eval "$VERIFY_COMMAND"

  build:
    name: build ${{ matrix.target }}
    needs: [checks, verify]
    if: >-
      !cancelled() && needs.checks.result == 'success'
      && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build-matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.checks.outputs.tag }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: ${{ inputs.working-directory }}
      - name: Add the target
        run: |
          set -euo pipefail
          if command -v mise >/dev/null && v="$(mise current rust 2>/dev/null)" && [ -n "$v" ]
          then
            echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"
            export RUSTUP_TOOLCHAIN="$v"
          fi
          if command -v rustup >/dev/null; then rustup target add "$TARGET"; fi
          host="$(rustc -vV 2>/dev/null | sed -n 's/^host: //p' || true)"
          echo "NATIVE=$([ "$host" = "$TARGET" ] && echo true || echo false)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }} -> target
          key: release-${{ matrix.target }}
          save-if: false
      - name: Setup
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: eval "$SETUP_COMMAND"
      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: eval "$BUILD_COMMAND"
      - name: Collect binaries
        env:
          BIN_DIR_TEMPLATE: ${{ inputs.bin-dir }}
          BINS: ${{ inputs.bins }}
        run: |
          set -euo pipefail
          src="$(eval "echo \"$BIN_DIR_TEMPLATE\"")"
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          out="$RUNNER_TEMP/bin"; mkdir -p "$out"
          for b in $BINS; do cp "$src/$b$ext" "$out/"; done
          echo "BIN_DIR=$out" >> "$GITHUB_ENV"
          ls -l "$out"
      - name: Files to sign
        if: runner.os == 'macOS' && inputs.macos-sign
        run: |
          {
            echo "SIGN_PATHS<<EOF"
            find "$BIN_DIR" -type f
            echo "EOF"
          } >> "$GITHUB_ENV"
      # Codesign (hardened runtime) + notarize; skips with a notice when the secrets are absent
      # unless require-macos-sign. `$/` resolves to this repository at the caller's pinned SHA.
      - name: Codesign and notarize (macOS)
        if: runner.os == 'macOS' && inputs.macos-sign
        uses: $/.github/actions/macos-sign
        with:
          mode: sign
          paths: ${{ env.SIGN_PATHS }}
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          api-key: ${{ secrets.APPSTORE_CONNECT_KEY }}
          api-key-id: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          api-issuer: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          apple-id: ${{ secrets.APPLE_ID }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-password: ${{ secrets.APPLE_APP_PASSWORD }}
          require: ${{ inputs.require-macos-sign }}
      - name: Smoke test
        if: env.NATIVE == 'true' && inputs.smoke-command != '' && matrix.smoke != false
        env:
          SMOKE_COMMAND: ${{ inputs.smoke-command }}
        run: eval "$SMOKE_COMMAND"
      - name: Package
        env:
          NAME_TEMPLATE: ${{ inputs.archive-name }}
          EXTRA_FILES: ${{ inputs.extra-files }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY#*/}"
          export REPO
          NAME_TEMPLATE="${NAME_TEMPLATE:-\$REPO-\$TAG-\$TARGET}"
          name="$(eval "echo \"$NAME_TEMPLATE\"" | tr '/' '-')"
          stage="$RUNNER_TEMP/stage/$name"; mkdir -p "$stage" "$RUNNER_TEMP/dist"
          cp "$BIN_DIR"/* "$stage/"
          for f in $EXTRA_FILES; do cp "$f" "$stage/"; done
          cd "$RUNNER_TEMP/stage"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$RUNNER_TEMP/dist/$name.zip" "$name" >/dev/null
            archive="$name.zip"
          else
            tar -czf "$RUNNER_TEMP/dist/$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          cd "$RUNNER_TEMP/dist"
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"
          else shasum -a 256 "$archive" > "$archive.sha256"; fi
          cat "$archive.sha256"
          echo "DIST_DIR=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.DIST_DIR }}
          if-no-files-found: error

  release:
    needs: [checks, build]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - if: inputs.mise && inputs.notes-command != ''
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Notes
        if: inputs.notes-command != ''
        env:
          NOTES_COMMAND: ${{ inputs.notes-command }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          set -euo pipefail
          export NOTES_FILE="$RUNNER_TEMP/notes.md"
          eval "$NOTES_COMMAND"
          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
      - name: Create the GitHub Release (and the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
          PRERELEASE: ${{ needs.checks.outputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          (cd dist && cat ./*.sha256 > SHA256SUMS)
          files=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS)
          args=(--target "$GITHUB_SHA" --title "$TAG")
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          [ "$DRAFT" = "true" ] && args+=(--draft)
          if [ -n "${NOTES_FILE:-}" ]; then args+=(--notes-file "$NOTES_FILE")
          else args+=(--generate-notes); fi
          gh release create "$TAG" "${args[@]}" "${files[@]}"

  publish:
    needs: [checks, release]
    if: ${{ !inputs.dry-run && (inputs.publish-crates || inputs.publish-command != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: ${{ inputs.working-directory }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: ${{ inputs.working-directory }}/dist
          merge-multiple: true
      - name: Publish to crates.io
        if: inputs.publish-crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PUBLISH_CRATES_COMMAND: ${{ inputs.publish-crates-command }}
        run: eval "$PUBLISH_CRATES_COMMAND"
      - name: Publish
        if: inputs.publish-command != ''
        env:
          TAG: ${{ needs.checks.outputs.tag }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_COMMAND: ${{ inputs.publish-command }}
        run: eval "$PUBLISH_COMMAND"
