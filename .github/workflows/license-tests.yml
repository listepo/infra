name: license-tests

# fmt, clippy and the tests of tools/license-kit (license drift check, sync against an
# in-memory GitHub, README block, sync config, CLA workflow config, auto-merge decision), all
# offline. Runs when the tool, the canonical files or the license workflows change.
on:
  pull_request:
    paths:
      - tools/license-kit/**
      - licenses/**
      - LICENSE
      - .github/workflows/license-*.yml
      - .github/workflows/cla*.yml
  push:
    branches: [main]
    paths:
      - tools/license-kit/**
      - licenses/**
      - LICENSE
      - .github/workflows/license-*.yml
      - .github/workflows/cla*.yml
  workflow_dispatch:

# Not callable: the newest run per ref wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # cancel-run on failure

defaults:
  run:
    working-directory: tools/license-kit

jobs:
  license-kit:
    name: license-kit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/license-kit -> target
          shared-key: license-kit
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # tests/cla.rs checks the reusable CLA workflow, written on docs/cla (pyrlyn/infra#21)
      # until it merges; without that branch the test skips with a message.
      - name: Fetch the CLA branch
        run: |
          git fetch --no-tags --depth 1 origin docs/cla:refs/remotes/origin/docs/cla \
            || echo "::notice::no docs/cla branch; the CLA config test reads this checkout only"
      - name: Tests
        run: cargo test --locked --no-fail-fast -- --nocapture
      - name: Cancel the run on failure
        if: failure()
        uses: ./.github/actions/cancel-run
