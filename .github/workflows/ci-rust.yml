name: ci-rust

# Reusable Rust CI: format check, clippy and cargo check.
#
# By default the Rust toolchain comes from the caller's mise.toml (listepo convention:
# mise.toml is the single source of the Rust version). Pass `rust-version` to install an
# exact toolchain through rustup instead. Either way the pinned version is exported as
# RUSTUP_TOOLCHAIN and the job fails if `rustc --version` is anything else.
on:
  workflow_call:
    inputs:
      rust-version:
        description: >-
          Exact Rust toolchain (e.g. "1.97.1"). Empty (default) installs Rust from the
          caller's mise.toml via jdx/mise-action.
        type: string
        required: false
        default: ""
      runs-on:
        description: Runner label for the job.
        type: string
        required: false
        default: ubuntu-latest
      working-directory:
        description: Directory of the Cargo workspace, relative to the repository root.
        type: string
        required: false
        default: "."
      mise-install-args:
        description: >-
          Tools mise installs when `rust-version` is empty. Defaults to Rust only, so
          unrelated tools in the caller's mise.toml are not installed.
        type: string
        required: false
        default: rust
      clippy-args:
        description: Extra arguments for cargo clippy, placed before `--`.
        type: string
        required: false
        default: ""
      cache-all-refs:
        description: >-
          Save the Cargo cache on every ref, not only the default branch. For callers
          whose CI runs only on pull requests, so a re-run of a pull request is warm.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, check
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Default path: the Rust version pinned in the caller's mise.toml.
      - if: inputs.rust-version == ''
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: ${{ inputs.working-directory }}
          install_args: ${{ inputs.mise-install-args }}

      # Make the mise pin the active toolchain for every later rustup/cargo call, so the
      # runner image's own stable can never stand in for it.
      - if: inputs.rust-version == ''
        run: |
          set -euo pipefail
          version="$(mise current rust)"
          [ -n "$version" ] || { echo "mise.toml pins no rust version" >&2; exit 1; }
          echo "RUST_PIN=$version" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"

      # Override path: an exact toolchain through rustup.
      - if: inputs.rust-version != ''
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          echo "RUST_PIN=$RUST_VERSION" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"

      # mise.toml may omit `components`; make sure both tools exist either way.
      - run: rustup component add rustfmt clippy

      - name: rustc is the pinned version
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustc --version | grep -q "^rustc $RUST_PIN " \
            || { echo "rustc is not the pinned Rust $RUST_PIN" >&2; exit 1; }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ inputs.working-directory }} -> target
          save-if: >-
            ${{ inputs.cache-all-refs
            || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - run: cargo fmt --all --check

      - env:
          CLIPPY_ARGS: ${{ inputs.clippy-args }}
        run: |
          # CLIPPY_ARGS is split on whitespace on purpose.
          # shellcheck disable=SC2086
          cargo clippy --all-targets --all-features $CLIPPY_ARGS -- -D warnings

      - run: cargo check --all-targets
